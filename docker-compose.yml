# ARCA — sobe o app em container
#   docker compose --env-file .env.local up --build
# O banco é o Supabase (nuvem ou local via `bunx supabase start`).
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    image: arca-web:latest
    container_name: arca-web
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    restart: unless-stopped
